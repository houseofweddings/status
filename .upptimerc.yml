# Upptime monitors these every five minutes from GitHub Actions and commits the results to
# history/. The status page is NOT Upptime's own site: it is site/, which reads history/ at view
# time and is deployed by .github/workflows/status-page.yml. See README.md.
owner: houseofweddings
repo: status

# Every check sends x-smoke-test. Vercel's firewall denies GitHub's datacenter IPs outright
# (403 `deny`, 2026-09-24), so without the bypass rule every monitor would read "down" while the
# site is fine. The header only helps once the Vercel Firewall rule exists:
#   request header x-smoke-test equals <SMOKE_TEST_TOKEN> → Bypass
# — the same rule the deploy smoke test in how-platform's ci.yml is waiting on.
# Upptime forwards a secret to the checks only if its name appears as `$NAME` in this file, so
# the repository secret must be named exactly SMOKE_TEST_TOKEN.
sites:
  - name: Website
    url: https://houseofweddings.ai/nl
    headers:
      - 'x-smoke-test: $SMOKE_TEST_TOKEN'
  - name: Partner portal
    url: https://partner.houseofweddings.ai/login
    headers:
      - 'x-smoke-test: $SMOKE_TEST_TOKEN'
  - name: Admin
    url: https://admin.houseofweddings.ai/login
    headers:
      - 'x-smoke-test: $SMOKE_TEST_TOKEN'
  # 200 when the app can reach Postgres, 503 when it cannot. A page can be served from cache while
  # the database is gone; this cannot.
  - name: API & database
    url: https://houseofweddings.ai/api/health
    headers:
      - 'x-smoke-test: $SMOKE_TEST_TOKEN'

assignees:
  - JensDanneelsHOW

# Upptime still needs this block to exist, but its generated Svelte site is not what we publish.
# GitHub Pages is set to "GitHub Actions" as its source, so the gh-pages branch its site workflow
# writes is never served.
status-website:
  name: House of Weddings status
  baseUrl: /status
