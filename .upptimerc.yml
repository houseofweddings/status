# Upptime monitors these every five minutes from GitHub Actions and commits the results to
# history/. The status page is NOT Upptime's own site: it is status-page/, which reads history/ at view
# time and is deployed by .github/workflows/status-page.yml. See README.md.
owner: houseofweddings
repo: status

# Every check sends x-smoke-test. Vercel's firewall denies GitHub's datacenter IPs outright
# (403 `deny`, 2026-09-24), so without the bypass rule every monitor would read "down" while the
# site is fine. The header only helps once the Vercel Firewall rule exists:
#   request header x-smoke-test equals <SMOKE_TEST_TOKEN> → Bypass
# — the same rule the deploy smoke test in how-platform's ci.yml is waiting on.
# Upptime forwards a secret to the checks only if its name appears as `$NAME` in this file, so
# the repository secret must be named exactly SMOKE_TEST_TOKEN.
# `slug` is pinned: it names the history file and the issue label, so renaming a site must
# not change it. The page shows its own translated name per slug, not `name`, which Upptime
# only uses in its (English) issue titles.
sites:
  - name: Website & planning tools
    slug: website
    url: https://houseofweddings.ai/nl
    headers:
      - 'x-smoke-test: $SMOKE_TEST_TOKEN'
  # Redirects to a random live vendor's page; the check follows it, so a 200 means a real
  # listing rendered. Across listings over time, rather than one page that can be unpublished.
  - name: Vendor pages
    slug: vendor-pages
    url: https://houseofweddings.ai/api/health/vendor
    headers:
      - 'x-smoke-test: $SMOKE_TEST_TOKEN'
  # Better Auth's own liveness route: the sign-in handler is mounted and answering.
  - name: Sign-in
    slug: auth
    url: https://houseofweddings.ai/api/auth/ok
    headers:
      - 'x-smoke-test: $SMOKE_TEST_TOKEN'
  # One probe each, 200 when the dependency answers, 503 when not (how-platform #187).
  - name: Photos & files
    slug: storage
    url: https://houseofweddings.ai/api/health/storage
    headers:
      - 'x-smoke-test: $SMOKE_TEST_TOKEN'
  # /api/health/cache exists but is not monitored: production has no UPSTASH_REDIS_REST_* yet
  # (2026-09-28), so it would read "down" permanently. Add it back once Redis is configured:
  #   - name: Caching / slug: cache / url: https://houseofweddings.ai/api/health/cache
  - name: API & database
    slug: api-and-database
    url: https://houseofweddings.ai/api/health/database
    headers:
      - 'x-smoke-test: $SMOKE_TEST_TOKEN'
  - name: Internal tools
    slug: admin
    url: https://admin.houseofweddings.ai/login
    headers:
      - 'x-smoke-test: $SMOKE_TEST_TOKEN'
  - name: PRO Collective
    slug: partner-portal
    url: https://partner.houseofweddings.ai/login
    headers:
      - 'x-smoke-test: $SMOKE_TEST_TOKEN'

assignees:
  - JensDanneelsHOW

# Upptime still needs this block to exist, but its generated Svelte site is not what we publish.
# GitHub Pages is set to "GitHub Actions" as its source, so the gh-pages branch its site workflow
# writes is never served.
status-website:
  name: House of Weddings status
  baseUrl: /status
